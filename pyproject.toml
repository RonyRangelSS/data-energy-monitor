[project]
name = "energy-monitor"
version = "0.1.0"
description = "Monitoramento e previsão do consumo energético em centros de dados com machine learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rony Rangel", email = "rony.rangel@upe.br" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "sqlalchemy==2.1.6",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]
notebook = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["energy_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: testes que exigem o PostgreSQL de teste",
]

[tool.coverage.run]
source = ["energy_monitor"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
