name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: energia
          POSTGRES_PASSWORD: energia
          POSTGRES_DB: energia_teste
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U energia -d energia_teste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://energia:energia@localhost:5433/energia_teste
      DATABASE_URL_TESTE: postgresql+psycopg://energia:energia@localhost:5433/energia_teste
      API_KEY: chave-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Testes
        run: uv run pytest --cov --cov-report=term-missing
