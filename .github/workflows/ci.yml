name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy
          POSTGRES_DB: energy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U energy -d energy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://energy:energy@localhost:5433/energy_test
      TEST_DATABASE_URL: postgresql+psycopg://energy:energy@localhost:5433/energy_test
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Testes
        run: uv run pytest --cov --cov-report=term-missing
